apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: gpt2-service:0.2
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: app-config
        command: ["gunicorn", "--bind", "0.0.0.0:5000", "app:app"]